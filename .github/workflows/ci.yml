name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Python tests (site API and MCP server)
        run: uv run --group dev pytest -q
      - name: Export scan (refuses on secrets, identifiers, canary)
        run: python3 tools/export_site_data.py --out /tmp/data.js
      - name: Safety scan through the MCP tool
        run: uv run python -c "from mcp_server import pipeline_ops as p; r=p.safety_scan(); print(r); raise SystemExit(0 if r['ok'] else 1)"
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --no-banner --log-level error .
