[project]
name = "hippagrchealthcare-site"
version = "0.1.0"
description = "Site and data API for the hippagrchealthcare pipeline (synthetic data only)"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1"]
[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
